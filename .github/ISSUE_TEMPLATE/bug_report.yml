name: Bug report
description: Something in GGV is wrong, crashes, hangs or is slower than it should be
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The diagnostics block is the most useful part: it says exactly which build you ran, on what system and graphics card, with which files and settings.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In GGV, open **View → About GGV and copy diagnostics**, press **Copy diagnostics** and paste here. File paths are left out unless you tick "Include full file paths". From the command line, `ggv --version` and `ggv-desktop --version` instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      placeholder: "Opening a session with two BAMs, the second track stayed empty; I expected its reads."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The locus, the settings you changed (colour, group, filters), what you clicked or typed. A saved session (Open → Save session as…) attached here helps.
      placeholder: |
        1. Open sample.bam with the hg38 reference
        2. Go to chr17:43,044,295
        3. Reads → Group → haplotype
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data
      multiple: true
      options:
        - Short reads (Illumina), whole genome
        - Short reads, exome or panel
        - PacBio HiFi
        - Oxford Nanopore
        - RNA-seq
        - CRAM
        - VCF / BCF
        - bigWig / bedGraph / SEG
        - Built-in genome or tracks
        - Other
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Desktop app (ggv-desktop)
        - Command line (ggv query / render / batch)
        - Agents (ggv mcp)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, the error text, how long it took if it was slow. Please don't attach patient data.
